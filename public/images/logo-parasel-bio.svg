<svg width="300" height="100" viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond avec la couleur de la navigation supérieure -->
  <rect width="300" height="100" fill="#f3f8f5" rx="12"/>
  
  <!-- Section gauche : Illustration des ingrédients -->
  <g transform="translate(20, 20)">
    <!-- Champignons -->
    <ellipse cx="25" cy="15" rx="8" ry="6" fill="#f8f9fa" stroke="#6b7280" stroke-width="1"/>
    <ellipse cx="35" cy="12" rx="6" ry="5" fill="#f8f9fa" stroke="#6b7280" stroke-width="1"/>
    <ellipse cx="25" cy="15" rx="4" ry="3" fill="#d1d5db"/>
    <ellipse cx="35" cy="12" rx="3" ry="2" fill="#d1d5db"/>
    
    <!-- Tomates -->
    <circle cx="20" cy="35" r="8" fill="#dc2626"/>
    <circle cx="35" cy="32" r="7" fill="#dc2626"/>
    <ellipse cx="20" cy="35" rx="3" ry="2" fill="#b91c1c"/>
    <ellipse cx="35" cy="32" rx="2.5" ry="1.5" fill="#b91c1c"/>
    
    <!-- Feuilles vertes -->
    <ellipse cx="15" cy="45" rx="6" ry="3" fill="#16a34a"/>
    <ellipse cx="30" cy="48" rx="5" ry="2.5" fill="#16a34a"/>
    <ellipse cx="25" cy="52" rx="4" ry="2" fill="#15803d"/>
    
    <!-- Ail -->
    <circle cx="15" cy="60" r="4" fill="#f8fafc" stroke="#6b7280" stroke-width="1"/>
    <circle cx="20" cy="58" r="3" fill="#f8fafc" stroke="#6b7280" stroke-width="1"/>
    <circle cx="18" cy="63" r="3.5" fill="#f8fafc" stroke="#6b7280" stroke-width="1"/>
    
    <!-- Citron vert -->
    <ellipse cx="30" cy="65" rx="5" ry="3" fill="#84cc16"/>
    <ellipse cx="30" cy="65" rx="3" ry="2" fill="#65a30d"/>
    
    <!-- Gingembre -->
    <ellipse cx="40" cy="70" rx="4" ry="2.5" fill="#d97706"/>
    <ellipse cx="38" cy="72" rx="3" ry="2" fill="#b45309"/>
    
    <!-- Poivre noir -->
    <circle cx="12" cy="75" r="1.5" fill="#1f2937"/>
    <circle cx="16" cy="78" r="1" fill="#1f2937"/>
    <circle cx="20" cy="76" r="1.2" fill="#1f2937"/>
  </g>
  
  <!-- Section droite : Texte de la marque -->
  <g transform="translate(120, 25)">
    <!-- Parasel avec le S doré -->
    <text x="0" y="25" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#1f2937">Para</text>
    <text x="65" y="25" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#d97706">s</text>
    <text x="75" y="25" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#1f2937">el</text>
    
    <!-- Symbole ® -->
    <text x="85" y="15" font-family="Arial, sans-serif" font-size="12" fill="#6b7280">®</text>
    
    <!-- BIO avec lignes -->
    <line x1="0" y1="40" x2="15" y2="40" stroke="#16a34a" stroke-width="2"/>
    <text x="25" y="45" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#16a34a" text-anchor="middle">BIO</text>
    <line x1="35" y1="40" x2="50" y2="40" stroke="#16a34a" stroke-width="2"/>
    
    <!-- Tagline -->
    <text x="25" y="65" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#dc2626" text-anchor="middle">Sale &amp; Épice ta Vie.</text>
  </g>
</svg> 